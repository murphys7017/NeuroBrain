[project]
name = "neurobrain"
version = "0.1.0"
description = "Artificial neural state and behavior engine for continuous character dynamics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ncps==1.0.1",
    "numpy>=2.2.0",
    "torch==2.14.1+cu130",
    "websockets>=15.0.1",
]

[project.scripts]
neurobrain = "neurobrain:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
python-preference = "only-managed"

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download-r2.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
