[project]
name = "neurobrain"
version = "0.1.0"
description = "Artificial neural state and behavior engine for continuous character dynamics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
neurobrain = "neurobrain:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
